[project]
name = "nl-sql"
version = "0.1.0"
description = "A local, read-only SQL exploration prototype using a configurable model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nl-sql = "nl_sql:main"

[project.optional-dependencies]
benchmark = [
    "psycopg[binary]>=3.2.0",
    "sqlglot>=26",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.2",
    "tqdm>=4.70.1",
]
